<!DOCTYPE html>
<html>

<head>

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Task Manager</h1>

        <button onclick="logout()">
            Logout
        </button>

    </div>


    <div class="form">

        <input
            type="text"
            id="title"
            placeholder="Task title">

        <input
            type="text"
            id="description"
            placeholder="Task description">

        <button onclick="addTask()">
            Add Task
        </button>

    </div>


    <h2>My Tasks</h2>

    <div id="tasks"></div>

</div>

<script src="script.js"></script>

</body>

</html>
